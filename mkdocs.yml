site_name: ZK-Stables Bridge
site_description: Privacy-preserving, non-custodial cross-chain stablecoin bridge across EVM, Cardano, and Midnight.
site_url: https://dextrlabs-dev.github.io/ZK-Stables-USDC-USDT-Non-Custodial-Bridge/
repo_url: https://github.com/dextrlabs-dev/ZK-Stables-USDC-USDT-Non-Custodial-Bridge
repo_name: dextrlabs-dev/ZK-Stables-USDC-USDT-Non-Custodial-Bridge
edit_uri: edit/main/gitbook/

docs_dir: gitbook
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Overview:
      - What is ZK-Stables?: overview/what-is-zk-stables.md
      - Prototype Status: overview/prototype-status.md
      - Changelog: overview/changelog.md
      - Releases: overview/releases.md
  - Architecture:
      - System Overview: architecture/system-overview.md
      - Bridge Swap Flow: architecture/bridge-swap-flow.md
      - Deposit Commitment Encoding: architecture/deposit-commitment-encoding.md
      - Burn Anchor Specification: architecture/burn-anchor-spec.md
  - Components:
      - Midnight Compact Contracts: components/midnight-contracts.md
      - EVM Solidity Contracts: components/evm-contracts.md
      - Cardano Validators (Aiken): components/cardano-validators.md
      - Relayer: components/relayer.md
      - SDK (zk-stables-sdk): components/sdk.md
      - Bridge CLI: components/bridge-cli.md
      - Operator Console: components/operator-console.md
  - Guides:
      - Quickstart (operator): guides/quickstart.md
      - SDK Integration Playbook (integrator): guides/sdk-integration.md
      - Usage Guide: guides/usage.md
      - Local EVM (Anvil): guides/local-evm.md
      - Cardano Local (Yaci): guides/cardano-local-yaci.md
      - Midnight Local CLI: guides/midnight-local-cli.md
  - Testing & Benchmarks:
      - Test Report: testing/test-report.md
      - Bridge TX Hash Report: testing/bridge-tx-hash-report.md
      - Integration Report: testing/integration-report.md
      - Benchmark Results: testing/benchmark-results.md
      - Uptime & Incidents: testing/uptime-and-incidents.md
  - Reference:
      - API Reference: reference/api-reference.md
      - Environment Variables: reference/environment-variables.md
      - Security Considerations: reference/security-considerations.md
  - Appendix:
      - Landscape Review: appendix/landscape-review.md
      - SRS Summary: appendix/srs-summary.md
      - Architecture Blueprint: appendix/architecture-blueprint.md
